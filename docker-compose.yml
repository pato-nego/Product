services:

  product:
    image: product:latest
    env_file: .env

    environment:
      REDIS_HOST: redis

    ports:
      - "8080:8080"

    volumes:
      - ./rds-ca.pem:/app/rds-ca.pem:ro

    depends_on:
      - redis

    restart: unless-stopped
    mem_limit: 600m

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru --save ""
    restart: unless-stopped
